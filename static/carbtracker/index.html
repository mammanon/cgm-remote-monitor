<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carb Tracker">
<meta name="theme-color" content="#0d9488">
<title>Carb Tracker</title>
<link rel="apple-touch-icon" href="/images/apple-touch-icon-152x152.png">
<link rel="icon" href="/images/android-chrome-192x192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f1f5f4;
    color: #1f2937;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: #0d9488; color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }
  header h1 { font-size: 19px; font-weight: 700; flex: 1; }
  .hbtn {
    background: rgba(255,255,255,.18); color: #fff; border: 0;
    border-radius: 10px; padding: 9px 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; min-height: 40px;
  }
  .hbtn:active { background: rgba(255,255,255,.3); }
  main { max-width: 860px; margin: 0 auto; padding: 14px 12px; }
  .banner {
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
    font-size: 15px; line-height: 1.45; display: none;
  }
  .banner.warn { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .banner.info { background: #e0f2f1; color: #0f5f57; border: 1px solid #99d6cf; }
  .banner .hbtn { background: #0d9488; margin-inline-start: 8px; }
  .card {
    background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    padding: 16px; margin-bottom: 14px;
  }
  #addMealBtn {
    display: block; width: 100%; border: 0; cursor: pointer;
    background: #0d9488; color: #fff; font-size: 18px; font-weight: 700;
    border-radius: 14px; padding: 15px; margin-bottom: 14px;
    box-shadow: 0 2px 6px rgba(13,148,136,.35);
  }
  #addMealBtn:active { background: #0b7d72; }
  form h2 { font-size: 17px; margin-bottom: 12px; color: #0f5f57; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 5px; }
  .field .unit { color: #6b7280; font-weight: 400; }
  .field input[type=number], .field input[type=text], .field input[type=datetime-local], .field textarea {
    width: 100%; font-size: 17px; padding: 11px 12px;
    border: 1.5px solid #d1d5db; border-radius: 10px; background: #fff; color: #111827;
    min-height: 46px; appearance: none; -webkit-appearance: none;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: #0d9488; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .timewrap { display: flex; gap: 8px; }
  .timewrap input { flex: 1; }
  .minibtn {
    border: 1.5px solid #0d9488; color: #0d9488; background: #fff;
    border-radius: 10px; padding: 0 14px; font-size: 15px; font-weight: 600; cursor: pointer; min-height: 46px;
  }
  .photo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #photoStrip { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .pthumb { position: relative; }
  .pthumb img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid #d1d5db; display: block; }
  .pthumb button {
    position: absolute; top: -8px; inset-inline-end: -8px;
    width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: #dc2626; color: #fff; font-size: 15px; line-height: 1; cursor: pointer;
  }
  .thumbs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .formbtns { display: flex; gap: 10px; margin-top: 16px; }
  .savebtn {
    flex: 1; border: 0; background: #0d9488; color: #fff; font-size: 17px; font-weight: 700;
    border-radius: 12px; padding: 13px; cursor: pointer; min-height: 48px;
  }
  .savebtn:disabled { opacity: .6; }
  .cancelbtn {
    border: 1.5px solid #9ca3af; background: #fff; color: #4b5563; font-size: 16px;
    border-radius: 12px; padding: 13px 18px; cursor: pointer; min-height: 48px;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .chip {
    border: 1.5px solid #0d9488; color: #0d9488; background: #fff; white-space: nowrap;
    border-radius: 999px; padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .chip.on { background: #0d9488; color: #fff; }
  #stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .stat { background: #fff; border-radius: 12px; padding: 10px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.07); flex: 1; min-width: 96px; text-align: center; }
  .stat b { display: block; font-size: 18px; color: #0f5f57; }
  .stat span { font-size: 12px; color: #6b7280; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: start; font-size: 13px; color: #6b7280; font-weight: 600;
    padding: 8px 8px; border-bottom: 2px solid #e5e7eb; white-space: nowrap;
  }
  tbody td { padding: 10px 8px; border-bottom: 1px solid #f3f4f6; font-size: 15px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  .bg { display: inline-block; min-width: 46px; text-align: center; font-weight: 700; border-radius: 8px; padding: 4px 8px; }
  .bg.ok    { background: #dcfce7; color: #166534; }
  .bg.low1  { background: #fee2e2; color: #b91c1c; }
  .bg.low2  { background: #dc2626; color: #fff; }
  .bg.high1 { background: #ffedd5; color: #c2410c; }
  .bg.high2 { background: #fde68a; color: #92400e; }
  .bg.none  { background: #f3f4f6; color: #9ca3af; font-weight: 400; }
  .bg.miss  { background: #dc2626; color: #fff; font-weight: 700; }
  .addafter.miss { border: 1.5px solid #dc2626; background: #dc2626; color: #fff; }
  #gapBanner {
    display: none; background: #fee2e2; border: 1.5px solid #dc2626; color: #991b1b;
    border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 15px; line-height: 1.55;
  }
  #factorCard { display: none; }
  #factorCard h2 { font-size: 16px; color: #0f5f57; margin-bottom: 10px; }
  .fcrow { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .fcrow b { font-size: 34px; color: #0d9488; font-variant-numeric: tabular-nums; line-height: 1; }
  .fcrow span { font-size: 15px; color: #4b5563; }
  #fc_basis { font-size: 14px; color: #4b5563; line-height: 1.55; margin-bottom: 6px; }
  #fc_method { font-size: 13px; color: #6b7280; line-height: 1.55; margin-bottom: 8px; }
  #fc_method button {
    border: 0; background: #f3f4f6; border-radius: 8px; padding: 5px 9px;
    font-size: 13px; cursor: pointer; margin-inline-start: 6px;
  }
  #fc_note { font-size: 13px; color: #92400e; background: #fef3c7; border-radius: 10px; padding: 9px 11px; line-height: 1.55; }
  .thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; border: 1px solid #e5e7eb; cursor: pointer; display: block; }
  .rowbtn {
    border: 0; background: #f3f4f6; border-radius: 8px; padding: 8px 10px;
    font-size: 15px; cursor: pointer; min-width: 38px; min-height: 38px;
  }
  .rowbtn.del { color: #b91c1c; }
  .addafter { border: 1px dashed #0d9488; background: #fff; color: #0d9488; border-radius: 8px; padding: 5px 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tstamp { white-space: nowrap; line-height: 1.35; }
  .tstamp small { color: #6b7280; display: block; }
  .notecell { color: #4b5563; font-size: 14px; max-width: 180px; overflow-wrap: break-word; }
  #empty { text-align: center; color: #6b7280; padding: 26px 10px; font-size: 15px; display: none; }
  #csvBtn {
    display: block; margin: 4px auto 6px; border: 1.5px solid #0d9488; background: #fff; color: #0d9488;
    border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .sharehint { text-align: center; color: #6b7280; font-size: 13px; line-height: 1.5; padding: 0 10px; }
  /* phone: table becomes cards */
  @media (max-width: 700px) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 12px; padding: 12px 14px; }
    tbody td { border: 0; padding: 5px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    tbody td::before { content: attr(data-label); font-size: 13px; color: #6b7280; font-weight: 600; }
    td.actioncell { justify-content: flex-end; gap: 12px; padding-top: 10px; border-top: 1px solid #f3f4f6; margin-top: 6px; }
    td.actioncell::before { display: none; }
    td.hideempty { display: none; }
    .thumb { width: 64px; height: 64px; }
    .notecell { max-width: none; text-align: end; }
    #listcard { background: transparent; box-shadow: none; padding: 0; }
  }
  /* food picker */
  #foodBtn { width: 100%; }
  #pickedWrap { margin-top: 8px; display: none; }
  .picked {
    display: flex; align-items: center; gap: 8px; justify-content: space-between;
    background: #f0fbf9; border: 1px solid #b9e5df; border-radius: 10px;
    padding: 7px 10px; margin-bottom: 6px; font-size: 14px;
  }
  .picked .pname { flex: 1; color: #0f5f57; }
  .picked .pg { color: #6b7280; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #foodSheet { align-items: stretch; justify-content: center; padding: 0; }
  .sheet { background: #f1f5f4; width: 100%; max-width: 640px; display: flex; flex-direction: column; max-height: 100%; }
  .sheethead {
    background: #0d9488; color: #fff; display: flex; gap: 10px; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 12px;
  }
  .sheethead h3 { flex: 1; font-size: 17px; font-weight: 700; }
  .sheetsearch { padding: 10px 12px 8px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  .sheetsearch input {
    width: 100%; font-size: 16px; padding: 10px 12px; border: 1.5px solid #d1d5db;
    border-radius: 10px; min-height: 44px; appearance: none; -webkit-appearance: none;
  }
  .sheetnote { font-size: 12px; color: #6b7280; margin-top: 7px; line-height: 1.5; }
  .foodlist { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 14px; }
  .foodrow { background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .foodrow.on { border: 1.5px solid #0d9488; }
  .foodrow .fname { flex: 1; font-size: 15px; line-height: 1.35; }
  .foodrow .fname small { display: block; color: #6b7280; font-size: 13px; }
  .foodrow .fg { font-weight: 700; color: #0f5f57; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .qty { display: flex; align-items: center; gap: 5px; }
  .qty button {
    width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid #0d9488;
    background: #fff; color: #0d9488; font-size: 20px; font-weight: 700; cursor: pointer; line-height: 1; padding: 0;
  }
  .qty b { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
  .fedit { border: 0; background: #f3f4f6; border-radius: 8px; padding: 8px 9px; cursor: pointer; font-size: 14px; min-height: 36px; }
  .fedit.del { color: #b91c1c; }
  .sheetfoot {
    background: #fff; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; align-items: center;
    padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  .sheetfoot .total { flex: 1; font-size: 17px; font-weight: 700; color: #0f5f57; font-variant-numeric: tabular-nums; }
  #newFoodCard { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: none; }
  #newFoodCard input {
    width: 100%; font-size: 16px; padding: 10px 11px; border: 1.5px solid #d1d5db;
    border-radius: 10px; margin-bottom: 8px; min-height: 44px; appearance: none; -webkit-appearance: none;
  }
  .carbdetail { display: block; color: #6b7280; font-size: 12px; line-height: 1.4; margin-top: 2px; }
  /* comments between the patient and the doctor */
  .chatbtn {
    border: 0; background: #e0f2f1; color: #0f5f57; border-radius: 8px;
    padding: 8px 10px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 38px;
  }
  .chatbtn.has { background: #0d9488; color: #fff; }
  #chatSheet { align-items: stretch; justify-content: center; padding: 0; }
  .chatbody {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #e9efec;
    padding: 14px 12px; display: flex; flex-direction: column; gap: 9px;
  }
  .bub {
    max-width: 80%; padding: 8px 11px 6px; border-radius: 12px; font-size: 15px; line-height: 1.5;
    box-shadow: 0 1px 1px rgba(0,0,0,.09); position: relative; overflow-wrap: break-word;
  }
  .bub .who { display: block; font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .bub .when { display: block; font-size: 11px; color: #6b7280; text-align: end; margin-top: 3px; }
  .bub.own { align-self: flex-end; background: #d7f7cd; }
  .bub.own .who { color: #166534; }
  .bub.other { align-self: flex-start; background: #fff; }
  .bub.other .who { color: #0d9488; }
  .bub .del {
    position: absolute; top: 1px; inset-inline-end: 3px; border: 0; background: none;
    color: #b91c1c; font-size: 13px; cursor: pointer; padding: 3px 5px; line-height: 1;
  }
  #chatEmpty { text-align: center; color: #6b7280; font-size: 14px; padding: 26px 10px; line-height: 1.6; }
  .chatfoot {
    background: #fff; border-top: 1px solid #e5e7eb; display: flex; gap: 8px; align-items: flex-end;
    padding: 10px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
  }
  .chatfoot textarea {
    flex: 1; font-size: 16px; padding: 11px 13px; border: 1.5px solid #d1d5db; border-radius: 18px;
    resize: none; min-height: 46px; max-height: 130px; font-family: inherit; color: #111827;
  }
  #chatSend {
    border: 0; background: #0d9488; color: #fff; width: 46px; height: 46px; border-radius: 50%;
    font-size: 18px; cursor: pointer; flex: 0 0 auto;
  }
  #chatSend:disabled { opacity: .5; }
  #chatLocked {
    background: #fff; border-top: 1px solid #e5e7eb; text-align: center; font-size: 14px;
    color: #4b5563; line-height: 1.6;
    padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  /* overlays */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .overlay.open { display: flex; }
  .dialog { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; }
  .dialog h3 { font-size: 17px; margin-bottom: 10px; color: #0f5f57; }
  .dialog p { font-size: 14px; color: #6b7280; margin-bottom: 12px; line-height: 1.5; }
  .dialog input {
    width: 100%; font-size: 17px; padding: 11px 12px; border: 1.5px solid #d1d5db;
    border-radius: 10px; margin-bottom: 8px; min-height: 46px;
  }
  .dialog .err { color: #b91c1c; font-size: 14px; min-height: 20px; margin-bottom: 6px; }
  #lightbox { background: rgba(0,0,0,.88); flex-direction: column; gap: 14px; }
  #lightbox img { max-width: 100%; max-height: 82vh; border-radius: 10px; }
  #lightbox .hbtn { background: rgba(255,255,255,.25); }
  #toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; border-radius: 999px; padding: 11px 20px; font-size: 15px;
    z-index: 60; display: none; max-width: 90vw; text-align: center;
  }
  [dir="rtl"] thead th, [dir="rtl"] tbody td { text-align: start; }
</style>
</head>
<body>

<header>
  <h1 id="pageTitle">Carb Tracker</h1>
  <button type="button" class="hbtn" id="notesBtn" aria-label="notes">💬</button>
  <button type="button" class="hbtn" id="langBtn">عربي</button>
  <button type="button" class="hbtn" id="lockBtn">🔓</button>
</header>

<main>
  <div class="banner warn" id="setupBanner"></div>
  <div class="banner info" id="readonlyBanner">
    <span id="readonlyText"></span>
    <button type="button" class="hbtn" id="unlockBtn2"></button>
  </div>

  <div id="gapBanner"></div>

  <div class="card" id="factorCard">
    <h2 id="fc_title">Suggested carb factor</h2>
    <div class="fcrow"><b id="fc_value">—</b><span id="fc_current"></span></div>
    <p id="fc_basis"></p>
    <p id="fc_method"></p>
    <p id="fc_note"></p>
  </div>

  <button type="button" id="addMealBtn">＋ <span id="addMealText">Add meal</span></button>

  <div class="card" id="formCard" style="display:none">
    <form id="mealForm" autocomplete="off">
      <h2 id="formTitle">Add meal</h2>

      <div class="field">
        <label for="mealTime" id="l_time">Meal time</label>
        <div class="timewrap">
          <input type="datetime-local" id="mealTime" required>
          <button type="button" class="minibtn" id="nowBtn">Now</button>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="bgBefore"><span id="l_before">Sugar before meal</span> <span class="unit" id="unitLabel1"></span></label>
          <input type="number" id="bgBefore" inputmode="decimal" step="any" min="0">
        </div>
        <div class="field">
          <label for="bgAfter"><span id="l_after">Sugar after meal</span> <span class="unit" id="unitLabel2"></span></label>
          <input type="number" id="bgAfter" inputmode="decimal" step="any" min="0">
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="carbs" id="l_carbs">Carbs (grams)</label>
          <input type="number" id="carbs" inputmode="decimal" step="any" min="0">
        </div>
        <div class="field">
          <label for="carbFactor" id="l_factor">Carb factor</label>
          <input type="number" id="carbFactor" inputmode="decimal" step="any" min="0" placeholder="9">
        </div>
      </div>

      <div class="field">
        <button type="button" class="minibtn" id="foodBtn">🍽️ <span id="foodBtnText">Calculate carbs from foods</span></button>
        <div id="pickedWrap"></div>
      </div>

      <div class="field">
        <label for="insulin"><span id="l_insulin">Insulin dose (units)</span> <span class="unit" id="l_optional1"></span></label>
        <input type="number" id="insulin" inputmode="decimal" step="any" min="0">
      </div>

      <div class="field">
        <label for="notes"><span id="l_notes">Notes</span> <span class="unit" id="l_optional2"></span></label>
        <textarea id="notes" rows="2" style="resize:vertical"></textarea>
      </div>

      <div class="field">
        <label id="l_photo">Meal photo</label>
        <div class="photo-row">
          <button type="button" class="minibtn" id="photoBtn">📷 <span id="photoBtnText">Add photo</span></button>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
        </div>
        <div id="photoStrip"></div>
      </div>

      <div class="formbtns">
        <button type="submit" class="savebtn" id="saveBtn">Save</button>
        <button type="button" class="cancelbtn" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>

  <div class="chips" id="chips"></div>
  <div id="stats"></div>

  <div class="card" id="listcard">
    <table id="mealTable">
      <thead>
        <tr>
          <th id="h_time">Time</th>
          <th id="h_before">Before</th>
          <th id="h_after">After</th>
          <th id="h_carbs">Carbs</th>
          <th id="h_factor">Factor</th>
          <th id="h_insulin">Insulin</th>
          <th id="h_photo">Photo</th>
          <th id="h_notes">Notes</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="mealRows"></tbody>
    </table>
    <div id="empty"></div>
  </div>

  <button type="button" id="csvBtn">⬇ CSV</button>
  <p class="sharehint" id="shareHint"></p>
</main>

<div class="overlay" id="unlockOverlay">
  <div class="dialog">
    <h3 id="u_title">Unlock</h3>
    <p id="u_hint"></p>
    <input type="password" id="secretInput" autocomplete="current-password">
    <div class="err" id="u_err"></div>
    <div class="formbtns" style="margin-top:4px">
      <button type="button" class="savebtn" id="u_ok">OK</button>
      <button type="button" class="cancelbtn" id="u_cancel">Cancel</button>
    </div>
  </div>
</div>

<div class="overlay" id="chatSheet">
  <div class="sheet">
    <div class="sheethead">
      <h3 id="chat_title">Comments</h3>
      <button type="button" class="hbtn" id="chatCloseBtn" aria-label="close">✕</button>

  var lang = localStorage.getItem('carbtracker-lang')

  if (lang !== 'ar' && lang !== 'en') { lang = 'en'; }

  function t (key) { return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key; }

  /* ---------------- state ---------------- */

  var state = {
    entries: []
    , rangeDays: 14

    , thresholds: { bgHigh: 260, bgTargetTop: 180, bgTargetBottom: 80, bgLow: 55 }
    , careportalEnabled: true

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- SHA-1 (for the API secret) ---------------- */
  function jsSha1 (str) {
    str = unescape(encodeURIComponent(str));
    var n = str.length, i;
    var words = [];
    for (i = 0; i < n; i++) {
      words[i >> 2] = (words[i >> 2] || 0) | ((str.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8));
    }
    words[n >> 2] = (words[n >> 2] || 0) | (0x80 << (24 - (n % 4) * 8));
    var total = (((n + 8) >> 6) + 1) * 16;
    for (i = 0; i < total; i++) { words[i] = words[i] || 0; }
    words[total - 1] = n * 8;
    var h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
    var w = new Array(80);
    function rol (x, s) { return (x << s) | (x >>> (32 - s)); }
    for (var b = 0; b < total; b += 16) {
      var a = h0, bb = h1, c = h2, d = h3, e = h4;
      for (i = 0; i < 80; i++) {
        w[i] = i < 16 ? words[b + i] : rol(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);
        var f, k;
        if (i < 20) { f = (bb & c) | (~bb & d); k = 0x5A827999; }
        else if (i < 40) { f = bb ^ c ^ d; k = 0x6ED9EBA1; }
        else if (i < 60) { f = (bb & c) | (bb & d) | (c & d); k = 0x8F1BBCDC; }
        else { f = bb ^ c ^ d; k = 0xCA62C1D6; }
        var tmp = (rol(a, 5) + f + e + k + w[i]) | 0;
        e = d; d = c; c = rol(bb, 30); bb = a; a = tmp;
      }
      h0 = (h0 + a) | 0; h1 = (h1 + bb) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
    }
    function hex (x) {
      var s = (x >>> 0).toString(16);
      while (s.length < 8) { s = '0' + s; }
      return s;
    }
    return hex(h0) + hex(h1) + hex(h2) + hex(h3) + hex(h4);
  }

  function sha1hex (str) {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      return window.crypto.subtle.digest('SHA-1', new TextEncoder().encode(str)).then(function (buf) {
        var bytes = new Uint8Array(buf), out = '';
        for (var i = 0; i < bytes.length; i++) { out += ('0' + bytes[i].toString(16)).slice(-2); }
        return out;
      }).catch(function () { return jsSha1(str); });
    }
    return Promise.resolve(jsSha1(str));
  }

  /* ---------------- auth ---------------- */
  // Same localStorage key the main Nightscout site uses, so unlocking once works for both.
  function getStoredHash () {
    var raw = localStorage.getItem('apisecrethash');
    if (!raw) { return null; }
    if (raw.length > 1 && raw.charAt(0) === '"' && raw.charAt(raw.length - 1) === '"') {
      raw = raw.slice(1, -1);
    }
    return /^[0-9a-f]{40}$/.test(raw) ? raw : null;
  }

  function storeHash (hash) {
    // raw hex, exactly the way the main Nightscout page stores it
    try { localStorage.setItem('apisecrethash', hash); } catch (e) { /* private mode */ }
  }

  function authHeaders (extra) {
    var h = extra || {};
    if (state.authHash) { h['api-secret'] = state.authHash; }
    return h;

  function verifyAuth (hash) {
    return fetch('/api/v1/verifyauth?t=' + Date.now(), {
      headers: { 'api-secret': hash }, cache: 'no-store'
    }).then(function (r) { return r.json(); })
      .then(function (j) { return j && j.message === 'OK'; })
      .catch(function () { return false; });
  }

  function setAuthenticated (on) {

    $('lockBtn').textContent = on ? '🔓' : '🔒';

    if (!on) { closeForm(); }
    render();
  }

  /* ---------------- API helpers ---------------- */
  function loadStatus () {
    return fetch('/api/v1/status.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        var settings = s && s.settings || {};
        if (settings.units) { state.units = settings.units; }
        state.careportalEnabled = s.careportalEnabled !== false;
        state.doctorEnabled = !!s.doctorCommentsEnabled;
        state.apiEnabled = s.apiEnabled !== false;
        var th = settings.thresholds;
        if (th && th.bgTargetTop) {
          state.thresholds = {
            bgHigh: Number(th.bgHigh) || 260
            , bgTargetTop: Number(th.bgTargetTop) || 180
            , bgTargetBottom: Number(th.bgTargetBottom) || 80
            , bgLow: Number(th.bgLow) || 55
          };
        }
        // site is in mmol but thresholds were left at the mg/dl defaults -> convert
        if (isMmol() && state.thresholds.bgTargetTop > 40) {
          state.thresholds = {
            bgHigh: round1(state.thresholds.bgHigh / 18.018)
            , bgTargetTop: round1(state.thresholds.bgTargetTop / 18.018)
            , bgTargetBottom: round1(state.thresholds.bgTargetBottom / 18.018)
            , bgLow: round1(state.thresholds.bgLow / 18.018)
          };
        }
      })
      .catch(function () { /* keep defaults */ });
  }

  function rangeStartISO () {
    if (!state.rangeDays) { return '2000-01-01T00:00:00.000Z'; }
    return new Date(Date.now() - state.rangeDays * 86400000).toISOString();
  }

  function loadEntries () {
    var url = '/api/v1/treatments?find[eventType]=' + encodeURIComponent(EVENT_TYPE)
      + '&find[created_at][$gte]=' + encodeURIComponent(rangeStartISO())
      + '&count=1000';
    return fetch(url, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('http ' + r.status); }
        return r.json();
      })
      .then(function (list) {
        state.entries = (Array.isArray(list) ? list : [])
          .filter(function (e) { return e && e.eventType === EVENT_TYPE; })
          .sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
        render();
      })
      .catch(function () {
        toast(t('loadError'));
      });

      return r.json();
    }).then(function (j) {
      if (!j || !j._id) { throw new Error('upload failed'); }
      return String(j._id);
    });
  }

    if (!doc) { return []; }
    if (Array.isArray(doc.mealImageIds)) { return doc.mealImageIds.slice(); }
    return doc.mealImageId ? [doc.mealImageId] : [];

    if (!id) { return Promise.resolve(); }
    return fetch('/api/v1/mealimages/' + encodeURIComponent(id), {
      method: 'DELETE', headers: authHeaders()

  /* ---------------- formatting ---------------- */
  function isMmol () { return /mmol/i.test(state.units); }
  function unitsLabel () { return isMmol() ? 'mmol/L' : 'mg/dL'; }
  function round1 (v) { return Math.round(v * 10) / 10; }

  function fmtDate (iso) {
    var d = new Date(iso);
    if (isNaN(d)) { return { d: '?', t: '' }; }
    var loc = lang === 'ar' ? 'ar-u-nu-latn' : undefined;
    try {
      return {
        d: d.toLocaleDateString(loc, { day: 'numeric', month: 'short', year: 'numeric' })
        , t: d.toLocaleTimeString(loc, { hour: 'numeric', minute: '2-digit' })
      };
    } catch (e) {
      return { d: d.toLocaleDateString(), t: d.toLocaleTimeString() };
    }
  }

  function toInputValue (d) {
    function p (x) { return (x < 10 ? '0' : '') + x; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
      + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function bgClass (v) {
    if (v === undefined || v === null || v === '' || isNaN(v)) { return 'none'; }
    var th = state.thresholds;
    if (v < th.bgLow) { return 'low2'; }
    if (v < th.bgTargetBottom) { return 'low1'; }
    if (v <= th.bgTargetTop) { return 'ok'; }
    if (v <= th.bgHigh) { return 'high1'; }
    return 'high2';
  }

  function esc (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function num (v) {
    if (v === undefined || v === null || v === '') { return null; }
    var n = Number(v);
    return isNaN(n) ? null : n;

  /* ---------------- food list (carb exchanges) ---------------- */

  var picker = { items: [], q: '' };

  function readJson (key, dflt) {
    try {
      var raw = localStorage.getItem(key);
      var val = raw ? JSON.parse(raw) : null;
      return val === null || val === undefined ? dflt : val;
    } catch (e) { return dflt; }
  }

  function writeJson (key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* ignore */ }
  }

  // Search should work whichever language is on screen, and forgive the
  // common Arabic spelling variants (ارز / أرز, حبه / حبة …).
  function normalizeSearch (str) {
    return String(str || '').toLowerCase()
      .replace(/[ً-ْـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ئ/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/ة/g, 'ه');
  }

  function allFoods () {
    var grams = readJson('ct-food-g', {});
    var hidden = readJson('ct-food-hidden', []);
    var custom = readJson('ct-food-custom', []);
    return DEFAULT_FOODS.concat(custom)
      .filter(function (f) { return hidden.indexOf(f.id) < 0; })
      .map(function (f) {
        var override = grams[f.id];
        return {
          id: f.id
          , name: lang === 'ar' ? f.ar : (f.en || f.ar)
          , unit: lang === 'ar' ? f.arU : (f.enU || f.arU)
          , key: normalizeSearch([f.ar, f.arU, f.en, f.enU].join(' '))
          , g: (override === undefined || override === null) ? Number(f.g) : Number(override)
          , custom: !!f.custom
        };
      });
  }

  function foodUsage () { return readJson('ct-food-used', {}); }

  function markFoodsUsed (items) {
    var used = foodUsage();
    var now = Date.now();
    items.forEach(function (i) { used[i.id] = now; });
    writeJson('ct-food-used', used);
  }

  function pickedTotal () {
    return picker.items.reduce(function (sum, i) { return sum + i.g * i.qty; }, 0);
  }

  function findPicked (id) {
    var found = null;
    picker.items.forEach(function (i) { if (i.id === id) { found = i; } });
    return found;
  }

  function renderPicked () {
    var wrap = $('pickedWrap');
    if (!picker.items.length) {
      wrap.style.display = 'none';
      wrap.innerHTML = '';
      return;
    }
    wrap.style.display = 'block';
    wrap.innerHTML = picker.items.map(function (i) {
      return '<div class="picked"><span class="pname">' + esc(i.name) + ' · ' + esc(i.unit) + ' ×' + esc(i.qty) + '</span>'
        + '<span class="pg">' + esc(round1(i.g * i.qty)) + ' ' + esc(t('gram')) + '</span></div>';
    }).join('');
  }

  function renderFoodList () {
    var q = normalizeSearch((picker.q || '').trim());
    var foods = allFoods().filter(function (f) {
      return !q || f.key.indexOf(q) >= 0;
    });
    // whatever she used before comes first; sort is stable, so everything else
    // keeps the order of the doctor's list
    var used = foodUsage();
    foods.sort(function (a, b) { return (used[b.id] || 0) - (used[a.id] || 0); });
    $('foodList').innerHTML = foods.length ? foods.map(function (f) {
      var chosen = findPicked(f.id);
      var qty = chosen ? chosen.qty : 0;
      return '<div class="foodrow' + (qty ? ' on' : '') + '">'
        + '<button type="button" class="fedit" data-fact="edit" data-id="' + esc(f.id) + '" aria-label="edit">✎</button>'
        + (f.custom ? '<button type="button" class="fedit del" data-fact="remove" data-id="' + esc(f.id) + '" aria-label="delete">🗑</button>' : '')
        + '<span class="fname">' + esc(f.name) + '<small>' + esc(f.unit) + '</small></span>'
        + '<span class="fg">' + esc(f.g) + ' ' + esc(t('gram')) + '</span>'
        + '<span class="qty">'
          + '<button type="button" data-fact="minus" data-id="' + esc(f.id) + '" aria-label="less">−</button>'
          + '<b>' + esc(qty) + '</b>'
          + '<button type="button" data-fact="plus" data-id="' + esc(f.id) + '" aria-label="more">+</button>'
        + '</span></div>';
    }).join('') : '<p style="text-align:center;color:#6b7280;padding:20px;line-height:1.6">' + esc(t('noFoodFound')) + '</p>';
    $('foodTotal').textContent = t('total') + ': ' + round1(pickedTotal()) + ' ' + t('gram');
  }

  function changeQty (id, delta) {
    var foods = allFoods();
    var food = null;
    foods.forEach(function (f) { if (f.id === id) { food = f; } });
    if (!food) { return; }
    var chosen = findPicked(id);
    if (!chosen) {
      if (delta < 0) { return; }
      picker.items.push({ id: food.id, name: food.name, unit: food.unit, g: food.g, qty: delta });
    } else {
      chosen.qty += delta;
      chosen.g = food.g;
      chosen.name = food.name;
      chosen.unit = food.unit;
      if (chosen.qty <= 0) {
        picker.items = picker.items.filter(function (i) { return i.id !== id; });
      }
    }
    renderFoodList();
  }

  function editFoodGrams (id) {
    var foods = allFoods();
    var food = null;
    foods.forEach(function (f) { if (f.id === id) { food = f; } });
    if (!food) { return; }
    var answer = window.prompt(food.name + ' · ' + food.unit + '\n' + t('editGrams'), String(food.g));
    if (answer === null) { return; }
    var value = Number(String(answer).replace(',', '.'));
    if (isNaN(value) || value < 0) { return; }
    var grams = readJson('ct-food-g', {});
    grams[id] = value;
    writeJson('ct-food-g', grams);
    var chosen = findPicked(id);
    if (chosen) { chosen.g = value; }
    renderFoodList();
  }

  function removeFood (id) {
    if (!window.confirm(t('deleteFoodAsk'))) { return; }
    var custom = readJson('ct-food-custom', []).filter(function (f) { return f.id !== id; });
    writeJson('ct-food-custom', custom);
    picker.items = picker.items.filter(function (i) { return i.id !== id; });
    renderFoodList();
  }

  function saveNewFood () {
    var name = $('nfName').value.trim();
    var unit = $('nfUnit').value.trim();
    var grams = num($('nfGrams').value);
    if (!name || grams === null || grams < 0) {
      window.alert(t('foodNeedsName'));
      return;
    }
    var custom = readJson('ct-food-custom', []);
    var food = {
      id: 'c' + Date.now().toString(36)
      , ar: name, arU: unit || '1', en: name, enU: unit || '1'
      , g: grams, custom: true
    };
    custom.push(food);
    writeJson('ct-food-custom', custom);
    $('nfName').value = '';
    $('nfUnit').value = '';
    $('nfGrams').value = '';
    $('newFoodCard').style.display = 'none';
    picker.q = '';
    $('foodSearch').value = '';
    changeQty(food.id, 1);

  function openFoodSheet () {
    picker.q = '';
    $('foodSearch').value = '';
    $('newFoodCard').style.display = 'none';
    renderFoodList();
    $('foodSheet').classList.add('open');

  function closeFoodSheet () {
    $('foodSheet').classList.remove('open');

  function useFoodTotal () {
    markFoodsUsed(picker.items);
    var total = round1(pickedTotal());
    // a meal of only zero-carb foods really is 0 g, so write the 0
    $('carbs').value = picker.items.length ? total : '';
    closeFoodSheet();
    renderPicked();

  function itemsForSaving () {
    return picker.items.map(function (i) {
      return { i: i.id, n: i.name, u: i.unit, q: i.qty, g: i.g };
    });

  function itemsFromDoc (doc) {
    if (!doc || !Array.isArray(doc.carbItems)) { return []; }
    return doc.carbItems.map(function (i) {
      return {
        id: i.i || i.n
        , name: i.n || ''
        , unit: i.u || ''
        , g: Number(i.g) || 0
        , qty: Number(i.q) || 1
      };
    });
  }

  // Show each food in the language the reader is using (the doctor may read
  // English while the meal was entered in Arabic). Foods added by hand only
  // exist on the phone that created them, so those keep their saved name.
  function localizedItems (doc) {
    if (!doc || !Array.isArray(doc.carbItems) || !doc.carbItems.length) { return []; }
    var byId = {};
    allFoods().forEach(function (f) { byId[f.id] = f; });
    return doc.carbItems.map(function (i) {
      var known = byId[i.i];
      return {
        name: known ? known.name : (i.n || '')
        , unit: known ? known.unit : (i.u || '')
        , qty: Number(i.q) || 1
      };
    });
  }

  function itemsSummary (doc) {
    return localizedItems(doc).map(function (i) { return i.name + ' ×' + i.qty; }).join(' · ');
  }

  /* ---------------- comments with the doctor ---------------- */
  function commentsFor (mealId) {
    return state.comments.filter(function (c) { return String(c.meal) === String(mealId); });
  }

  function myRole () {
    if (state.authenticated) { return 'patient'; }
    if (state.isDoctor) { return 'doctor'; }
    return null;
  }

  function authorName (author) {
    return author === 'doctor' ? t('doctorName') : t('patientName');
  }

  function loadComments () {
    return fetch('/api/v1/mealcomments?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (list) {
        state.comments = Array.isArray(list) ? list : [];
        render();
      })
      .catch(function () { /* keep whatever we already have */ });
  }

  function renderChat () {
    var list = commentsFor(state.chatMeal);
    var role = myRole();
    var body = $('chatBody');

    body.innerHTML = list.length ? list.map(function (c) {
      var own = role && c.author === role;
      var when = fmtDate(c.created_at);
      return '<div class="bub ' + (own ? 'own' : 'other') + '">'
        + (state.authenticated ? '<button type="button" class="del" data-cdel="' + esc(c._id) + '" aria-label="delete">✕</button>' : '')
        + '<span class="who">' + esc(authorName(c.author)) + '</span>'
        + esc(c.text).replace(/\n/g, '<br>')
        + '<span class="when">' + esc(when.t) + ' · ' + esc(when.d) + '</span>'
        + '</div>';
    }).join('') : '<p id="chatEmpty">' + esc(t('noComments')) + '</p>';
    body.scrollTop = body.scrollHeight;

    var canWrite = !!role;
    $('chatFoot').style.display = canWrite ? 'flex' : 'none';
    $('chatLocked').style.display = canWrite ? 'none' : 'block';
    $('chatInput').placeholder = t('writeHere') + (role ? ' (' + authorName(role) + ')' : '');
    $('chatLockedText').textContent = state.doctorEnabled ? t('chatLockedHint') : t('doctorNotSet');
    $('doctorBtn').textContent = t('iAmDoctor');
    $('doctorBtn').style.display = state.doctorEnabled ? 'inline-block' : 'none';
  }

  function openChat (mealId, title) {
    state.chatMeal = mealId;
    $('chat_title').textContent = title;
    renderChat();
    $('chatSheet').classList.add('open');
    loadComments().then(renderChat);
  }

  function sendComment () {
    var text = $('chatInput').value.trim();
    var role = myRole();
    if (!text || !role) { return; }
    var headers = { 'Content-Type': 'application/json' };
    if (role === 'patient') { headers['api-secret'] = state.authHash; }
    else { headers['doctor-code'] = state.doctorHash; }
    $('chatSend').disabled = true;
    fetch('/api/v1/mealcomments', {
      method: 'POST'
      , headers: headers
      , body: JSON.stringify({ meal: state.chatMeal, text: text })
    }).then(function (r) {
      if (!r.ok) { throw new Error('post failed ' + r.status); }
      $('chatInput').value = '';
      return loadComments().then(renderChat);
    }).catch(function () {
      toast(t('saveError'), 4000);
    }).then(function () {
      $('chatSend').disabled = false;
    });
  }

  function deleteComment (id) {
    if (!window.confirm(t('deleteCommentAsk'))) { return; }
    fetch('/api/v1/mealcomments/' + encodeURIComponent(id), { method: 'DELETE', headers: authHeaders() })
      .then(function (r) {
        if (!r.ok) { throw new Error('delete failed'); }
        return loadComments().then(renderChat);
      })
      .catch(function () { toast(t('saveError'), 4000); });
  }

  function useDoctorCode (hash) {
    return fetch('/api/v1/verifydoctor?t=' + Date.now(), {
      headers: { 'doctor-code': hash }, cache: 'no-store'
    }).then(function (r) { return r.json(); })
      .then(function (j) { return !!(j && j.message === 'OK'); })
      .catch(function () { return false; });
  }

  function askDoctorCode () {
    var code = window.prompt(t('doctorCodePrompt'));
    if (code === null) { return; }
    if (code.length < 8) {
      window.alert(t('codeTooShort'));
      return;
    }
    sha1hex(code).then(function (hash) {
      return useDoctorCode(hash).then(function (ok) {
        if (!ok) {
          window.alert(t('wrongCode'));
          return;
        }
        state.doctorHash = hash;
        state.isDoctor = true;
        try { localStorage.setItem('ct-doctorcode', hash); } catch (e) { /* private mode */ }
        renderChat();
        toast(t('doctorReady'));
      });
    });
  }

  /* ---------------- suggested carb factor ---------------- */
  // How far one unit of insulin moves the sugar. The doctor's rule is one unit
  // per 40 mg/dL; it can be changed if the doctor gives a different number.
  function correctionStep () {
    var saved = Number(readJson('ct-correction-mgdl', 0));
    var mgdl = saved > 0 ? saved : 40;
    return isMmol() ? round1(mgdl / 18.018) : mgdl;
  }

  function askCorrectionStep () {
    var answer = window.prompt(t('fcAskStep') + ' (' + unitsLabel() + ')', String(correctionStep()));
    if (answer === null) { return; }
    var value = Number(String(answer).replace(',', '.'));
    if (isNaN(value) || value <= 0) { return; }
    writeJson('ct-correction-mgdl', isMmol() ? value * 18.018 : value);
    render();
  }

  // Look at the last four days. For each meal we know the carbs, the insulin
  // that went with them, and how high the sugar still was afterwards. Sugar
  // left above target is insulin that was missing, so the factor that would
  // have worked is carbs / (insulin given + insulin missing).
  function factorAdvice () {
    var target = state.thresholds.bgTargetTop;
    var step = correctionStep();
    var since = Date.now() - 4 * 86400000;
    var factors = [];
    var latestUsed = null;

    state.entries.forEach(function (e) {
      var when = new Date(e.created_at).getTime();
      if (isNaN(when) || when < since) { return; }
      var carbs = num(e.carbs);
      var after = num(e.bgAfter);
      var before = num(e.glucose);
      var factorUsed = num(e.carbFactor);
      var insulin = num(e.insulin);
      if (factorUsed !== null && latestUsed === null) { latestUsed = factorUsed; }
      if (carbs === null || carbs <= 0 || after === null || before === null) { return; }
      var given = (insulin !== null && insulin > 0) ? insulin
        : ((factorUsed !== null && factorUsed > 0) ? carbs / factorUsed : null);
      if (given === null) { return; }
      var ideal = given + (after - target) / step;
      if (ideal <= 0) { return; }
      factors.push(carbs / ideal);
    });

    if (!factors.length) { return { count: 0, target: target, step: step, current: latestUsed }; }
    factors.sort(function (a, b) { return a - b; });
    var mid = Math.floor(factors.length / 2);
    var median = factors.length % 2 ? factors[mid] : (factors[mid - 1] + factors[mid]) / 2;
    return {
      value: Math.round(median * 2) / 2
      , count: factors.length
      , target: target
      , step: step
      , current: latestUsed
    };
  }

  function renderFactorCard () {
    var advice = factorAdvice();
    $('factorCard').style.display = 'block';
    $('fc_title').textContent = t('fcTitle');
    $('fc_method').innerHTML = esc(t('fcMethod')
      .replace('{target}', advice.target)
      .replace('{step}', advice.step)
      .replace(/\{units\}/g, unitsLabel()))
      + ' <button type="button" id="fc_edit">✎ ' + esc(t('fcEdit')) + '</button>';
    $('fc_edit').onclick = askCorrectionStep;

    if (!advice.count) {
      $('fc_value').textContent = '—';
      $('fc_current').textContent = '';
      $('fc_basis').textContent = t('fcNone');
      $('fc_note').style.display = 'none';
      return;
    }
    $('fc_value').textContent = advice.value;
    $('fc_current').textContent = advice.current !== null ? t('fcCurrent').replace('{x}', advice.current) : '';
    $('fc_basis').textContent = t('fcBasis').replace('{n}', advice.count);
    $('fc_note').textContent = t('fcNote');
    $('fc_note').style.display = 'block';
  }

  function renderGaps () {
    var missBefore = 0, missAfter = 0, missCarbs = 0;
    state.entries.forEach(function (e) {
      if (num(e.glucose) === null) { missBefore++; }
      if (num(e.bgAfter) === null) { missAfter++; }
      if (num(e.carbs) === null && !(Array.isArray(e.carbItems) && e.carbItems.length)) { missCarbs++; }
    });
    function part (count, key) {
      return count + ' ' + t(count === 1 ? 'gapMeal' : 'gapMeals') + ' ' + t(key);
    }
    var parts = [];
    if (missBefore) { parts.push(part(missBefore, 'gapBefore')); }
    if (missAfter) { parts.push(part(missAfter, 'gapAfter')); }
    if (missCarbs) { parts.push(part(missCarbs, 'gapCarbs')); }
    var banner = $('gapBanner');
    banner.style.display = parts.length ? 'block' : 'none';

  // A meal can be entered with an older date; widen the shown period so the
  // patient still sees the meal she just saved.
  function ensureRangeIncludes (when) {
    if (!state.rangeDays || !when || isNaN(when)) { return; }
    var ageDays = (Date.now() - when.getTime()) / 86400000;
    if (ageDays <= state.rangeDays) { return; }
    var wider = 0;
    RANGES.forEach(function (r) {
      if (!wider && r.days && ageDays <= r.days) { wider = r.days; }
    });
    state.rangeDays = wider;   // 0 means "All"
    renderChips();
  }

        loadEntries();

      wrap.appendChild(b);

  function avg (values) {
    var v = values.filter(function (x) { return x !== null; });
    if (!v.length) { return null; }
    return round1(v.reduce(function (a, b) { return a + b; }, 0) / v.length);
  }

    wrap.innerHTML =
      stat(t('meals'), es.length)
      + stat(t('avgBefore'), avg(es.map(function (e) { return num(e.glucose); })))
      + stat(t('avgAfter'), avg(es.map(function (e) { return num(e.bgAfter); })))
      + stat(t('avgCarbs'), avg(es.map(function (e) { return num(e.carbs); })))
      + stat(t('avgFactor'), avg(es.map(function (e) { return num(e.carbFactor); })));

  function compressPhoto (file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var MAX = 1280;
          var w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) { throw new Error('bad image'); }
          var scale = Math.min(1, MAX / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          var cx = canvas.getContext('2d');
          cx.fillStyle = '#fff';
          cx.fillRect(0, 0, cw, ch);
          cx.drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', 0.8));
        } catch (e) {
          URL.revokeObjectURL(url);
          reject(e);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('bad image'));
      };
      img.src = url;
    });
  }

  function buildDoc (imageIds) {
    var when = new Date($('mealTime').value);
    if (isNaN(when)) { when = new Date(); }

    var doc = state.editingDoc ? JSON.parse(JSON.stringify(state.editingDoc)) : {};
    doc.eventType = EVENT_TYPE;
    doc.enteredBy = 'Carb Tracker';
    doc.eventTime = when.toISOString();
    delete doc.created_at; // the server rebuilds it from eventTime

    function setOrDelete (key, value) {
      if (value === null) { delete doc[key]; } else { doc[key] = value; }
    }
    setOrDelete('glucose', num($('bgBefore').value));
    setOrDelete('bgAfter', num($('bgAfter').value));
    setOrDelete('carbs', num($('carbs').value));
    setOrDelete('carbFactor', num($('carbFactor').value));
    setOrDelete('insulin', num($('insulin').value));
    setOrDelete('notes', $('notes').value.trim() || null);
    setOrDelete('carbItems', picker.items.length ? itemsForSaving() : null);
    if (num($('bgBefore').value) !== null) {
      doc.glucoseType = 'Finger';
      doc.units = state.units;
    } else {
      delete doc.glucoseType;
      delete doc.units;
    }
    delete doc.mealImageId;   // meals used to hold a single photo
    setOrDelete('mealImageIds', imageIds && imageIds.length ? imageIds : null);
    return doc;
  }

  function saveMeal (ev) {
    ev.preventDefault();
    if (state.busy) { return; }
    state.busy = true;
    $('saveBtn').disabled = true;
    toast(t('saving'), 15000);

    var oldIds = docImageIds(state.editingDoc);

    var photoStep = Promise.all(state.photos.added.map(function (dataUrl) {
      return uploadPhoto(dataUrl);
    }));

    photoStep.then(function (uploadedIds) {
      var imageIds = state.photos.kept.concat(uploadedIds);
      var doc = buildDoc(imageIds);
      var isEdit = !!state.editingId;
      if (isEdit) { doc._id = state.editingId; }
      return fetch('/api/v1/treatments/', {
        method: isEdit ? 'PUT' : 'POST'
        , headers: authHeaders({ 'Content-Type': 'application/json' })
        , body: JSON.stringify(doc)
      }).then(function (r) {
        if (!r.ok) { throw new Error('save failed ' + r.status); }
        // clean up photos the patient removed from this meal
        oldIds.forEach(function (id) {
          if (imageIds.indexOf(id) < 0) { deletePhoto(id); }
        });
        return doc;
      });
    }).then(function (doc) {
      toast(t('saved'));
      ensureRangeIncludes(new Date(doc.eventTime));
      closeForm();
      loadEntries();
    }).catch(function () {
      toast(t('saveError'), 5000);
    }).then(function () {
      state.busy = false;
      $('saveBtn').disabled = false;
    });
  }

  function deleteMeal (id) {
    var entry = null;
    state.entries.forEach(function (e) { if (String(e._id) === String(id)) { entry = e; } });
    if (!window.confirm(t('deleteAsk'))) { return; }
    fetch('/api/v1/treatments/' + encodeURIComponent(id), {
      method: 'DELETE', headers: authHeaders()
    }).then(function (r) {
      if (!r.ok) { throw new Error('delete failed'); }
      docImageIds(entry).forEach(deletePhoto);
      commentsFor(id).forEach(function (c) {
        fetch('/api/v1/mealcomments/' + encodeURIComponent(c._id), { method: 'DELETE', headers: authHeaders() })
          .catch(function () { /* best effort */ });
      });
      toast(t('deleted'));
      loadEntries();
    }).catch(function () {
      toast(t('saveError'), 5000);
    });
  }

  /* ---------------- CSV ---------------- */
  function csvEscape (v) {
    var s = String(v == null ? '' : v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCsv () {
    var rows = [['Date', 'Time', 'Sugar before (' + unitsLabel() + ')', 'Sugar after (' + unitsLabel() + ')'
      , 'Carbs (g)', 'Meal details', 'Carb factor', 'Insulin (units)', 'Notes', 'Photo']];
    state.entries.slice().reverse().forEach(function (e) {
      var d = new Date(e.created_at);
      rows.push([
        isNaN(d) ? '' : d.toLocaleDateString('en-GB')
        , isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
        , num(e.glucose) === null ? '' : num(e.glucose)
        , num(e.bgAfter) === null ? '' : num(e.bgAfter)
        , num(e.carbs) === null ? '' : num(e.carbs)
        , localizedItems(e).map(function (i) {
          return i.name + (i.unit ? ' (' + i.unit + ')' : '') + ' x' + i.qty;
        }).join(' + ')
        , num(e.carbFactor) === null ? '' : num(e.carbFactor)
        , num(e.insulin) === null ? '' : num(e.insulin)
        , e.notes || ''
        , docImageIds(e).map(function (id) { return location.origin + photoUrl(id); }).join(' | ')
      ]);
    });
    var csv = '\uFEFF' + rows.map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var today = new Date();
    a.download = 'carb-tracker-' + today.getFullYear()
      + ('0' + (today.getMonth() + 1)).slice(-2)
      + ('0' + today.getDate()).slice(-2) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 2000);
  }

  $('doctorBtn').onclick = askDoctorCode;
  $('chatInput').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      sendComment();
    }
  });
  $('chatBody').addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-cdel]');
    if (el) { deleteComment(el.getAttribute('data-cdel')); }
  });

  $('lightbox').onclick = function () { $('lightbox').classList.remove('open'); };
  $('csvBtn').onclick = exportCsv;

  /* ---------------- start ---------------- */
  applyLang();
  loadStatus().then(function () {
    applyLang(); // unit labels may have changed
    if (!state.apiEnabled || !state.careportalEnabled) {
      $('setupBanner').style.display = 'block';
    }
    var stored = getStoredHash();
    if (stored) {
      verifyAuth(stored).then(function (ok) {
        if (ok) { state.authHash = stored; }
        setAuthenticated(ok);
      });
    } else {
      setAuthenticated(false);
    }
    loadEntries();
    loadComments();

    var storedCode = null;
    try { storedCode = localStorage.getItem('ct-doctorcode'); } catch (e) { /* ignore */ }
    if (storedCode && /^[0-9a-f]{40}$/.test(storedCode)) {
      useDoctorCode(storedCode).then(function (ok) {
        state.isDoctor = ok;
        if (ok) { state.doctorHash = storedCode; }
        if (state.chatMeal !== null) { renderChat(); }
      });
    }
  });

})();
</script>
</body>
</html>
